<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Обследование ВОЛС</title>
<meta name="description" content="Обследование трассы ВОЛС: точки по GPS, фото по списку, отметки, выгрузка архивом">
<meta name="theme-color" content="#0f2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Обследование">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#13202c;--mut:#5d6d7c;--line:#cfd8e1;--acc:#0b63c5;--accInk:#fff;--chip:#e6ecf2;--ok:#1b8a3a;--mid:#b86e00;--bad:#c62828;--bar:#0f2740;--barInk:#fff;--shade:rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1319;--card:#16202a;--ink:#e6edf3;--mut:#97a7b7;--line:#2b3947;--acc:#4c9dff;--accInk:#04111f;--chip:#22303d;--bar:#09192a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.vh{position:fixed;left:-2000px;top:0;width:1px;height:1px;opacity:0}
.top{position:sticky;top:0;z-index:30;background:var(--bar);color:var(--barInk);padding:calc(env(safe-area-inset-top) + 6px) 8px 8px;display:flex;align-items:center;gap:6px;min-height:52px}
.top h1{font-size:18px;margin:0 4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:inherit;min-width:44px;min-height:44px;font-size:24px;line-height:1;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.gps{font-size:14px;font-weight:700;padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.18);white-space:nowrap;cursor:pointer}
.gps.ok{background:#1b8a3a}.gps.mid{background:#b86e00}.gps.bad{background:#c62828}
main{padding:12px 12px 150px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--ink);text-align:center;-webkit-user-select:none;user-select:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.big{width:100%;min-height:56px;font-size:18px}
.btn.red{color:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.grid{display:grid;gap:8px}
.mut{color:var(--mut)}
.small{font-size:14px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 4px 8px}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.badge{min-width:44px;height:44px;padding:0 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.it .tx{flex:1;min-width:0}
.it .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:14px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);border-radius:20px;padding:8px 14px;min-height:42px;font-size:16px}
.chip.on{background:var(--acc);color:var(--accInk);font-weight:600}
.fl{margin:14px 2px 6px;font-size:14px;color:var(--mut);font-weight:600}
input.tx,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);font-size:17px;-webkit-appearance:none;appearance:none}
textarea{min-height:96px;resize:vertical}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{position:relative;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:14px;color:var(--mut);overflow:hidden;background:var(--card);cursor:pointer}
.slot.has{border:2px solid var(--ok);padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:13px;padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .n{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px}
.coord{font-variant-numeric:tabular-nums;font-size:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;min-height:56px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;left:0;right:0;z-index:35;display:flex;gap:8px;padding:0 12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.fab.low{bottom:calc(12px + env(safe-area-inset-bottom))}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.22)}
.sheet-bg{position:fixed;inset:0;background:var(--shade);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:19px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(130px + env(safe-area-inset-bottom));z-index:3000;background:#1d2a36;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:696px;margin:0 auto}
#mapwrap{position:fixed;left:0;right:0;top:56px;bottom:calc(57px + env(safe-area-inset-bottom));z-index:20;display:none;background:#dde3e8}
#map{position:absolute;inset:0}
.mapbar{position:absolute;z-index:1000;display:flex;gap:6px}
.mapbar.tr{top:10px;right:10px}
.mapbar.br{bottom:12px;right:10px;flex-direction:column}
.mapbar button{border:0;border-radius:10px;background:rgba(255,255,255,.95);color:#13202c;min-height:40px;min-width:44px;padding:0 10px;font-weight:600;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mapbar.br button{font-size:22px}
.mapbar button.on{background:#0b63c5;color:#fff}
#cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:900;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#e53935;box-shadow:0 0 0 1px #fff}
#cross:before{left:21px;top:0;width:2px;height:44px}
#cross:after{top:21px;left:0;height:2px;width:44px}
#placebar{position:absolute;left:10px;right:10px;bottom:12px;z-index:1000;margin:0}
.mk-pt span,.mk-task span,.mk-span span{display:block;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
.mk-pt span{min-width:28px;height:28px;padding:0 6px;border-radius:14px;color:#fff;font:700 14px/24px -apple-system,Arial,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk-task span{padding:2px 6px;border-radius:6px;background:#fff;color:#0b63c5;border:2px solid #0b63c5;font:700 13px/16px -apple-system,Arial,sans-serif}
.mk-span span{background:rgba(255,255,255,.92);color:#111;border-radius:4px;padding:1px 4px;font:600 12px/14px -apple-system,Arial,sans-serif}
details summary{cursor:pointer}
ol{padding-left:22px;margin:8px 0}
li{margin:5px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="mapwrap">
  <div id="map"></div>
  <div class="mapbar tr"><button data-a="map-base" data-b="2gis">2ГИС</button><button data-a="map-base" data-b="osm">OSM</button><button data-a="map-base" data-b="sat">Спутник</button></div>
  <div class="mapbar br"><button data-a="map-me" aria-label="Где я">◎</button><button data-a="map-fit" aria-label="Показать всё">⤢</button></div>
  <div id="cross" hidden></div>
  <div id="placebar" class="card" hidden></div>
</div>
<input type="file" id="inCam" class="vh" accept="image/*" capture="environment">
<input type="file" id="inGal" class="vh" accept="image/*" multiple>
<input type="file" id="inTask" class="vh">
<script>
'use strict';
// Обследование трассы ВОЛС — РНД-Строй. Один файл, без сервера: данные в телефоне (IndexedDB), выгрузка ZIP.
const VER = '1.0.1 · 27.10.2026';
const DECL = 8.5;            // магнитное склонение, Ростов-на-Дону, ° к востоку (азимут по компасу + DECL = истинный)

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n, k = 2) => String(n).padStart(k, '0');
const fmtT = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtD = t => { const d = new Date(t); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
const fmtM = m => m == null || !isFinite(m) ? '—' : m < 10 ? String(Math.round(m * 10) / 10).replace('.', ',') : String(Math.round(m));
const fmtDist = m => m < 1000 ? Math.round(m) + ' м' : (m / 1000).toFixed(1).replace('.', ',') + ' км';
const fmtMB = b => (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' МБ';
const code = p => 'T' + pad(p.n);

const SET = (() => { let s = {}; try { s = JSON.parse(localStorage.getItem('obsled-set') || '{}'); } catch (e) {} return Object.assign({photoMax: 2560, base: '2gis'}, s); })();
function saveSet() { try { localStorage.setItem('obsled-set', JSON.stringify(SET)); } catch (e) {} }

// ---------------------------------------------------------------- типы точек, отметки, фото по списку
const TYPES = {
  opora:   {name: 'Опора',       col: '#0b63c5', line: true,  slots: ['Опора целиком', 'Табличка, номер', 'Верх: провода, крепления', 'Вперёд по трассе']},
  muf:     {name: 'Муфта',       col: '#7b3fb8', line: true,  slots: ['Муфта', 'Бирка', 'Опора целиком', 'Ввод кабелей, запас']},
  perehod: {name: 'Переход',     col: '#d06a00', line: false, slots: ['Поперёк дороги', 'Опора напротив', 'Вдоль дороги']},
  nov:     {name: 'Новая опора', col: '#c62828', line: true,  slots: ['Место', 'Вперёд по трассе']},
  kolodec: {name: 'Колодец',     col: '#795548', line: false, slots: ['Люк', 'Внутри', 'Каналы']},
  bs:      {name: 'БС / ввод',   col: '#1b8a3a', line: true,  slots: ['Опора БС, здание', 'Шкаф, ввод', 'Подход кабеля', 'Проезд, ворота']},
  zam:     {name: 'Заметка',     col: '#607d8b', line: false, slots: ['Фото']},
};
const MORE = 'Ещё';
const FORMS = {
  opora: [
    {k: 'tab', t: 'text', l: 'Номер, надпись на табличке'},
    {k: 'vlad', t: 'one', l: 'Чья опора', o: ['Донэнерго', 'Ростгорсвет', 'Связь', 'Другая', 'Не видно']},
    {k: 'tip', t: 'one', l: 'Тип', o: ['Ж/б 0,4 кВ', 'Ж/б 6–10 кВ', 'Освещение', 'Связь', 'Металл', 'Дерево']},
    {k: 'vys', t: 'one', l: 'Высота, м', o: ['8', '9,5', '10', '11', '12+', '?']},
    {k: 'sost', t: 'one', l: 'Состояние', o: ['Норма', 'Наклон', 'Трещины', 'Плохое']},
    {k: 'kab', t: 'one', l: 'Кабелей связи уже висит', o: ['0', '1', '2', '3', '4', '5+']},
    {k: 'mesto', t: 'one', l: 'Место под наш кабель', o: ['Есть', 'Тесно', 'Нет']},
    {k: 'ugol', t: 'one', l: 'Угловая', o: ['Нет', 'Да, есть подкос', 'Да, без подкоса']},
    {k: 'pom', t: 'many', l: 'Помехи в пролёте', o: ['Деревья', 'Ввод в дом', 'Растяжка', 'Въезд, ворота', 'Реклама']},
    {k: 'per', t: 'one', l: 'Отсюда переход через дорогу', o: ['Нет', 'Да']},
    {k: 'shir', t: 'num', l: 'Ширина дороги, м', iff: f => f.per === 'Да'},
  ],
  muf: [
    {k: 'tab', t: 'text', l: 'Номер опоры, табличка'},
    {k: 'marka', t: 'text', l: 'Марка муфты'},
    {k: 'birka', t: 'text', l: 'Чья муфта (бирка)'},
    {k: 'kab', t: 'text', l: 'Кабели — сколько, куда уходят'},
    {k: 'vvod', t: 'one', l: 'Свободный ввод', o: ['Есть', 'Нет', '?']},
    {k: 'zap', t: 'one', l: 'Место под запас 15 м', o: ['Есть', 'Нет']},
  ],
  perehod: [
    {k: 'ul', t: 'text', l: 'Улица'},
    {k: 'shir', t: 'num', l: 'Ширина проезжей части, м'},
    {k: 'opory', t: 'one', l: 'Опоры', o: ['С двух сторон', 'С одной', 'Нет']},
    {k: 'vys', t: 'one', l: 'Провода над дорогой', o: ['Выше 6 м', 'Ниже 6 м', '?']},
    {k: 'pom', t: 'many', l: 'Помехи', o: ['Светофор', 'Трамвай, троллейбус', 'Деревья']},
  ],
  nov: [
    {k: 'poch', t: 'text', l: 'Почему нужна'},
    {k: 'grunt', t: 'one', l: 'Покрытие', o: ['Грунт', 'Асфальт', 'Плитка', 'Газон']},
  ],
  kolodec: [
    {k: 'nom', t: 'text', l: 'Номер, чей'},
    {k: 'tip', t: 'one', l: 'Тип', o: ['ККС-1', 'ККС-2', 'ККС-3', 'ККС-4', 'ККС-5', 'Другой']},
    {k: 'sost', t: 'one', l: 'Состояние', o: ['Норма', 'Залит', 'Повреждён', 'Не открыть']},
    {k: 'kan', t: 'text', l: 'Каналы — свободные, занятые'},
  ],
  bs: [
    {k: 'vys', t: 'num', l: 'Высота крепления кабеля, м'},
    {k: 'spusk', t: 'text', l: 'Спуск к шкафу — как, длина'},
    {k: 'vvod', t: 'one', l: 'Свободный гермоввод', o: ['Есть', 'Нет', '?']},
    {k: 'kross', t: 'one', l: 'Место под кросс', o: ['Есть', 'Нет', '?']},
    {k: 'dost', t: 'text', l: 'Проезд, ворота, кто открывает'},
  ],
  zam: [],
};
const COPY_KEYS = ['vlad', 'tip', 'vys', 'sost', 'kab', 'mesto'];

const ICO = {
  list: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  map: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  task: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  exp: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>',
  cam: '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};

// ---------------------------------------------------------------- геометрия
const RAD = Math.PI / 180, RE = 6371008.8;
function dist(a, b) {
  const dLa = (b.lat - a.lat) * RAD, dLo = (b.lon - a.lon) * RAD;
  const s = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLo / 2) ** 2;
  return 2 * RE * Math.asin(Math.min(1, Math.sqrt(s)));
}
function shift(lat, lon, az, d) {
  const b = az * RAD;
  return {lat: lat + d * Math.cos(b) / RE / RAD, lon: lon + d * Math.sin(b) / (RE * Math.cos(lat * RAD)) / RAD};
}
// где стоит сама опора: у опоры — точка съёмки, в стороне — сдвиг по азимуту и расстоянию
function pos(p) {
  if (!p || p.lat == null || p.lon == null) return null;
  if (p.mode === 's' && p.az != null && p.d > 0) return shift(p.lat, p.lon, p.az + DECL, p.d);
  return {lat: p.lat, lon: p.lon};
}
function span(p) {
  if (!TYPES[p.type] || !TYPES[p.type].line) return null;
  const a = pos(p); if (!a) return null;
  const i = S.pts.indexOf(p);
  for (let j = i - 1; j >= 0; j--) {
    const q = S.pts[j];
    if (TYPES[q.type] && TYPES[q.type].line) { const b = pos(q); return b ? dist(a, b) : null; }
  }
  return null;
}
function nearTask(q, max = 60) {
  const t = S.survey && S.survey.task; if (!t || !q) return null;
  let best = null;
  for (const x of t.points) { const d = dist(q, x); if (!best || d < best.d) best = {x, d}; }
  return best && best.d <= max ? best : null;
}

// ---------------------------------------------------------------- база в телефоне
const DB = {
  d: null,
  open() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open('rnd-obsled', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('surveys')) d.createObjectStore('surveys', {keyPath: 'id'});
        if (!d.objectStoreNames.contains('points')) d.createObjectStore('points', {keyPath: 'id'}).createIndex('survey', 'survey');
        if (!d.objectStoreNames.contains('files')) { const f = d.createObjectStore('files', {keyPath: 'id'}); f.createIndex('survey', 'survey'); f.createIndex('point', 'point'); }
        if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs', {keyPath: 'id'});
      };
      r.onsuccess = () => { this.d = r.result; this.d.onversionchange = () => this.d.close(); res(); };
      r.onerror = () => rej(r.error || new Error('IndexedDB'));
      r.onblocked = () => rej(new Error('база занята — закройте другие вкладки с программой'));
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = this.d.transaction(store, mode); } catch (e) { rej(e); return; }
      let out;
      const q = fn(t.objectStore(store));
      if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error || new Error('запись не прошла'));
      t.onabort = () => rej(t.error || new Error('запись прервана'));
    });
  },
  get(s, id) { return this.req(s, 'readonly', o => o.get(id)); },
  put(s, v) { return this.req(s, 'readwrite', o => o.put(v)); },
  del(s, id) { return this.req(s, 'readwrite', o => o.delete(id)); },
  all(s) { return this.req(s, 'readonly', o => o.getAll()); },
  by(s, ix, k) { return this.req(s, 'readonly', o => o.index(ix).getAll(k)); },

  'pt-move'(el) {
    const p = curPt(), i = S.pts.indexOf(p), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= S.pts.length) return;
    const q = S.pts[j]; [p.n, q.n] = [q.n, p.n];
    S.pts.sort((a, b) => a.n - b.n);
    savePoint(p).catch(() => {}); savePoint(q).catch(() => {}); rr();
  },
  async 'pt-del'() {
    const p = curPt(); if (!p) return;
    if (!confirm(`Удалить точку Т${p.n}${p.photos.length ? ` вместе с фото (${p.photos.length})` : ''}?`)) return;
    if (Refine.pid === p.id) Refine.stop(true);
    for (const f of p.photos) { await DB.del('files', f.id); await DB.del('thumbs', f.id); dropURL(f.id); }
    for (const a of p.audio) { await DB.del('files', a.id); dropURL(a.id); }
    await DB.del('points', p.id);
    S.pts = S.pts.filter(q => q !== p);
    for (let k = 0; k < S.pts.length; k++) if (S.pts[k].n !== k + 1) { S.pts[k].n = k + 1; await savePoint(S.pts[k]); }
    S.zip = null; S.pid = null;
    ACT.back();
  },
  'pt-type'(el) { const p = curPt(); p.type = el.dataset.t; savePoint(p).catch(() => {}); rr(); },
  'pt-mode'(el) { const p = curPt(); p.mode = el.dataset.m; savePoint(p).catch(() => {}); updCoord(p); },
  'pt-d'(el) { const p = curPt(); p.d = Number(el.dataset.d); savePoint(p).catch(() => {}); updCoord(p); },
  refix() { const p = curPt(); Refine.start(p.id); toast('Стойте у опоры 10 секунд', 3000); },
  'pt-map'() { const p = curPt(); S.focus = p.id; S.place = p.id; S.tab = 'map'; go('survey', {pid: null}); },
  'place-ok'() {
    const p = S.pts.find(q => q.id === S.place); if (!p || !MAP.m) return;
    const c = MAP.m.getCenter();
    if (Refine.pid === p.id) Refine.stop(true);
    Object.assign(p, {lat: c.lat, lon: c.lng, acc: null, alt: null, src: 'map', fixN: 0, fixT: Date.now(), mode: 'u'});
    savePoint(p).catch(() => {});
    S.place = null; MAP.draw(); MAP.placeUI(); toast(`Т${p.n} поставлена на карте`);
  },
  'place-no'() { S.place = null; MAP.placeUI(); },
  'map-base'(el) { MAP.setBase(el.dataset.b); },
  'map-me'() { const g = GPS.fresh(60000); if (g && MAP.m) MAP.m.setView([g.lat, g.lon], Math.max(MAP.m.getZoom(), 17)); else toast('GPS ещё не поймал'); },
  'map-fit'() { MAP.fit(); },
  bearing() {
    const pr = COMPASS.request();      // первым делом — пока длится нажатие
    const upd = h => { const e = $('#cmp'); if (e) e.textContent = Math.round(h) + '°'; const a = $('#cmpacc'); if (a && COMPASS.acc != null && COMPASS.acc >= 0) a.textContent = 'погрешность компаса ±' + Math.round(COMPASS.acc) + '°'; };
    sheet(`<h3>Направление на опору</h3><div class="small">Держите телефон горизонтально, верхним краем точно на опору, и нажмите «Засечь».</div><div id="cmp" style="font-size:60px;text-align:center;font-weight:700;margin:18px 0 4px">—</div><div id="cmpacc" class="small mut" style="text-align:center;min-height:20px"></div><div class="row" style="margin-top:12px"><button class="btn pri big" data-a="bearing-set">Засечь</button><button class="btn big" data-a="sheet-close">Отмена</button></div>`, () => COMPASS.subs.delete(upd));
    COMPASS.subs.add(upd);
    pr.then(ok => { if (!ok) { const e = $('#cmp'); if (e) { e.textContent = 'нет доступа к компасу'; e.style.fontSize = '20px'; } } });
  },
  'bearing-set'() {
    const p = curPt(), h = COMPASS.fresh();
    if (h == null) { toast('Компас молчит — поводите телефоном восьмёркой и попробуйте ещё раз', 5000); return; }
    p.az = Math.round(h * 10) / 10; p.azAcc = COMPASS.acc != null && COMPASS.acc >= 0 ? Math.round(COMPASS.acc) : null;
    savePoint(p).catch(() => {}); closeSheet(); updCoord(p);
  },
  chip(el) {
    const p = curPt(), k = el.dataset.k, v = el.dataset.v;
    if (el.dataset.m === '1') { const a = Array.isArray(p.f[k]) ? p.f[k] : []; p.f[k] = a.includes(v) ? a.filter(x => x !== v) : a.concat(v); }
    else p.f[k] = p.f[k] === v ? null : v;
    savePoint(p).catch(() => {});
    if ((FORMS[p.type] || []).some(d => d.iff)) rr();
    else for (const b of $$(`[data-a="chip"][data-k="${k}"]`)) b.classList.toggle('on', el.dataset.m === '1' ? (p.f[k] || []).includes(b.dataset.v) : p.f[k] === b.dataset.v);
  },
  'copy-prev'() {
    const p = curPt(), i = S.pts.indexOf(p);
    for (let j = i - 1; j >= 0; j--) {
      const q = S.pts[j];
      if (q.type !== 'opora') continue;
      for (const k of COPY_KEYS) if (q.f[k] != null) p.f[k] = q.f[k];
      savePoint(p).catch(() => {}); rr(); toast(`Отметки взяты с Т${q.n} — проверьте`); return;
    }
  },
  cam(el) {
    const p = curPt(); if (!p) return;
    S.pend = {pid: p.id, slot: el.dataset.slot, head: COMPASS.fresh(), g: GPS.fresh(15000), gal: false};
    if ($('#sheet')) setTimeout(closeSheet, 400);
  },
  gal() { const p = curPt(); if (p) S.pend = {pid: p.id, slot: MORE, head: null, g: null, gal: true}; },
  async 'ph-view'(el) {
    const p = curPt(), sl = el.dataset.slot, fs = p.photos.filter(f => f.slot === sl), urls = [];
    sheet(`<h3>Т${p.n} · ${esc(sl)}</h3>` + fs.map(f => `<div class="card" style="padding:8px"><img data-full="${f.id}" alt="" style="width:100%;display:block;border-radius:8px;min-height:140px;background:rgba(127,127,127,.2)"><div class="row small mut" style="margin-top:6px;justify-content:space-between"><span>${fmtT(f.time)} · ${f.w}×${f.h} · ${fmtMB(f.size)}${f.acc != null ? ` · ±${fmtM(f.acc)} м` : ''}${f.gal ? ' · из галереи' : ''}</span><button class="btn red" style="flex:0 0 auto" data-a="ph-del" data-id="${f.id}">Удалить</button></div></div>`).join('')
      + `<div class="row"><label class="btn pri" for="inCam" data-a="cam" data-slot="${esc(sl)}">Ещё снимок</label><button class="btn" data-a="sheet-close">Закрыть</button></div>`, () => urls.forEach(u => URL.revokeObjectURL(u)));
    for (const im of $$('#sheet img[data-full]')) {
      const r = await DB.get('files', im.dataset.full);
      if (r && $('#sheet')) { const u = URL.createObjectURL(new Blob([r.data], {type: 'image/jpeg'})); urls.push(u); im.src = u; }
    }
  },
  async 'ph-del'(el) {
    const p = curPt(), id = el.dataset.id;
    if (!confirm('Удалить это фото?')) return;
    p.photos = p.photos.filter(f => f.id !== id);
    await DB.del('files', id); await DB.del('thumbs', id); dropURL(id);
    await savePoint(p); closeSheet(); rr();
  },
  async rec() {
    if (REC.on) { await REC.stop(); rr(); return; }
    try { await REC.start(curPt()); } catch (e) { toast('Микрофон недоступен: ' + errMsg(e), 6000); return; }
    rr();
  },
  'au-play'(el) {
    const u = AU.get(el.dataset.id);
    if (!u) { toast('Загружаю запись — нажмите ещё раз'); fillMedia(); return; }
    if (PLAY) PLAY.pause();
    PLAY = new Audio(u); PLAY.play().catch(e => toast('Не играет: ' + e.message));
  },
  async 'au-del'(el) {
    const p = curPt(), id = el.dataset.id;
    if (!confirm('Удалить голосовую заметку?')) return;
    p.audio = p.audio.filter(a => a.id !== id);
    await DB.del('files', id); dropURL(id); await savePoint(p); rr();
  },
  async zip(el) {
    if (S.busy) return;
    flushSave();
    S.busy = true; el.disabled = true; const t0 = el.textContent; el.textContent = 'Собираю…';
    try { S.zip = await buildZip(el.dataset.full === '1', (i, n) => { el.textContent = `Собираю… ${i} из ${n}`; }); rr(); }
    catch (e) { console.error(e); toast('Архив не собрался: ' + errMsg(e), 8000); el.disabled = false; el.textContent = t0; }
    finally { S.busy = false; }
  },
  'zip-reset'() { S.zip = null; rr(); },
  share() {
    const z = S.zip; if (!z) return;
    let file = new File([z.blob], z.name, {type: 'application/zip'});
    if (navigator.canShare && !navigator.canShare({files: [file]})) file = new File([z.blob], z.name, {type: 'application/octet-stream'});
    if (navigator.share && navigator.canShare && navigator.canShare({files: [file]})) {
      navigator.share({files: [file], title: z.name}).then(() => toast('Готово'), e => { if (e && e.name !== 'AbortError') toast('Не отправилось: ' + e.message + '. Нажмите «Сохранить в Файлы».', 8000); });
    } else { toast('Отправка отсюда недоступна — сохраняю в «Файлы»', 5000); download(z.blob, z.name); }
  },
  save() { if (S.zip) download(S.zip.blob, S.zip.name); },
  'set-photo'(el) { SET.photoMax = Number(el.dataset.v); saveSet(); rr(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  if (el.tagName !== 'LABEL') e.preventDefault();
  try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast('Ошибка: ' + errMsg(err), 8000); }); }
  catch (err) { console.error(err); toast('Ошибка: ' + errMsg(err), 8000); }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.f; if (!k) return;
  const p = curPt(); if (!p) return;
  if (k === 'note') p.note = el.value; else p.f[k] = el.value;
  queueSave(p);
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.f) flushSave(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);
$('#inCam').addEventListener('change', e => onFiles(e.target));
$('#inGal').addEventListener('change', e => onFiles(e.target));
$('#inTask').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; closeSheet();
  if (!f) return;
  let t;
  try { const txt = await f.text(); t = /\.kml$/i.test(f.name) || txt.trim().startsWith('<') ? kmlToTask(txt, f.name.replace(/\.[^.]+$/, '')) : await decodeTask(txt); }
  catch (err) { toast('Не получилось прочитать задание: ' + err.message, 7000); return; }
  await useTask(t);
});
window.addEventListener('popstate', async e => {
  flushSave(); closeSheet();
  const s = e.state || {view: 'home'};
  if (s.view === 'home' || !s.sid) { Object.assign(S, {view: 'home', sid: null, survey: null, pts: [], pid: null}); render(); return; }
  if (s.sid !== S.sid) { try { await loadSurvey(s.sid); } catch (err) { Object.assign(S, {view: 'home'}); render(); return; } }
  if (REC.on) REC.stop();
  Object.assign(S, {view: s.view, pid: s.pid, tab: s.tab || 'pts'});
  render();
});
window.addEventListener('error', e => toast('Ошибка: ' + (e.message || 'неизвестная'), 8000));
window.addEventListener('unhandledrejection', e => toast('Ошибка: ' + errMsg(e.reason), 8000));

(async function init() {
  try { await DB.open(); }
  catch (e) { app().innerHTML = `<main><div class="card">Хранилище не открылось: ${esc(errMsg(e))}. Не открывайте программу в «Частном доступе» Safari.</div></main>`; return; }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    if (/nosw/.test(location.search)) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    else navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const h = location.hash, saved = history.state;
  if (/[#&][zt]=/.test(h)) {
    history.replaceState(st(0), '', location.pathname + location.search);
    try { await useTask(await decodeTask(h)); return; } catch (e) { toast('Ссылка-задание не прочиталась: ' + e.message, 8000); }
  } else if (saved && saved.sid) {          // страница перезагрузилась (например, после камеры) — возвращаемся туда же
    try { await loadSurvey(saved.sid); Object.assign(S, {view: saved.view, tab: saved.tab || 'pts', pid: saved.pid}); } catch (e) { S.view = 'home'; }
  }
  history.replaceState(st(depth()), '');
  render();
})();
// ссылка-задание открыта во вкладке, где программа уже открыта, — меняется только «#…»: перечитать как новую
window.addEventListener('hashchange', () => { if (/[#&][zt]=/.test(location.hash)) location.reload(); });
window.OBS = {S, DB, GPS, COMPASS, ACT, buildZip, addPhoto, exifBlock, withExif, makeZip, decodeTask, kmlToTask, useTask, render};
</script>
</body>
</html>
